name: Daily art video

on:
  schedule:
    - cron: "0 8 * * *"   # every day at 08:00 UTC
  workflow_dispatch:       # lets you run it manually to test

permissions:
  contents: write          # needed to save history.json back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check key
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "length: ${#K}"
          echo "starts with: ${K:0:7}"

      - name: Generate idea and video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_EXTRA_INPUT: ${{ vars.VIDEO_EXTRA_INPUT }}
        run: python daily_art_video.py

      - name: Keep a backup copy for 3 days
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/
          retention-days: 3

      - name: Save history so ideas never repeat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "Update idea history"
          git push
